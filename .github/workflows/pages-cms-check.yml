name: Check docs

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-cms-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check local media references
        run: node scripts/check-content.mjs

      # 图片变体是纯派生文件，缓存后重复检查只需几秒。
      - name: Cache image variants
        uses: actions/cache@v4
        with:
          path: public/images
          key: image-variants-${{ hashFiles('public/images/**/*.{png,jpg,jpeg,webp}') }}
          restore-keys: |
            image-variants-

      - name: Build and validate MDX
        run: npm run build
